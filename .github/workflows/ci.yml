name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Tier 1
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create verified non-reparse checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $safeCheckout = "C:\roborev-dashboard-ci-$runKey"
          $safeTemp = "C:\roborev-dashboard-ci-temp-$runKey"
          $drive = Get-Item -LiteralPath 'C:\' -Force
          if (($drive.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'C:\ is a reparse point.' }
          if (Test-Path -LiteralPath $safeCheckout -PathType Any) { throw "Refusing to reuse existing CI checkout: $safeCheckout" }
          if (Test-Path -LiteralPath $safeTemp -PathType Any) { throw "Refusing to reuse existing CI temp directory: $safeTemp" }
          git -c credential.helper= -c core.askPass= clone --no-local --no-hardlinks --no-checkout "$env:GITHUB_WORKSPACE" $safeCheckout
          if ($LASTEXITCODE -ne 0) { throw 'Local source clone failed.' }
          git -C $safeCheckout checkout --detach --quiet $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Exact GITHUB_SHA checkout failed.' }
          $head = (git -C $safeCheckout rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA.ToLowerInvariant()) { throw "Safe checkout HEAD mismatch: $head" }
          $status = git -C $safeCheckout status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or -not [string]::IsNullOrWhiteSpace(($status -join "`n"))) { throw 'Safe checkout is not clean.' }
          $current = (Resolve-Path -LiteralPath $safeCheckout -ErrorAction Stop).Path
          while ($true) {
            $item = Get-Item -LiteralPath $current -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "Safe checkout ancestry is a reparse point: $current" }
            $parent = Split-Path -Parent $current
            if ([string]::IsNullOrEmpty($parent) -or $parent -eq $current) { break }
            $current = $parent
          }
          New-Item -ItemType Directory -Path $safeTemp -Force | Out-Null
          $tempItem = Get-Item -LiteralPath $safeTemp -Force
          if (($tempItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Safe CI temp directory is a reparse point.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SAFE_CHECKOUT=$safeCheckout"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SAFE_TEMP=$safeTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$safeTemp"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$safeTemp"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ env.SAFE_CHECKOUT }}\go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      - name: Record effective Go compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SAFE_CHECKOUT
          try {
            go version
            if ($LASTEXITCODE -ne 0) { throw 'Go compiler version query failed.' }
            go env GOVERSION GOTOOLCHAIN GOOS GOARCH GOMOD
            if ($LASTEXITCODE -ne 0) { throw 'Go compiler environment query failed.' }
          } finally { Pop-Location }

      - name: Check Windows Go vulnerabilities
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SAFE_CHECKOUT
          try {
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...
            if ($LASTEXITCODE -ne 0) { throw "Windows govulncheck failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SAFE_CHECKOUT
          try { npm ci --prefix web; if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" } }
          finally { Pop-Location }

      - name: Run repository tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SAFE_CHECKOUT
          try { ./scripts/test.ps1 }
          finally { Pop-Location }

      - name: Run Go vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SAFE_CHECKOUT
          try { go vet ./... }
          finally { Pop-Location }

      - name: Build development executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SAFE_CHECKOUT
          try { ./scripts/build.ps1 }
          finally { Pop-Location }

      - name: Check development executable contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:SAFE_CHECKOUT 'dist\roborev-dashboard.exe') --help
          & (Join-Path $env:SAFE_CHECKOUT 'dist\roborev-dashboard.exe') --version
          & (Join-Path $env:SAFE_CHECKOUT 'dist\roborev-dashboard.exe') --version-json

      - name: Build reproducible CI package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SAFE_CHECKOUT
          try { ./scripts/package.ps1 -Version 0.0.0-ci.1 -OutputDirectory .\dist\ci\0.0.0-ci.1 -VerifyReproducible }
          finally { Pop-Location }

      - name: Run packaged release smoke
        shell: pwsh
        run: |
          $artifact = Join-Path $env:SAFE_CHECKOUT 'dist\ci\0.0.0-ci.1\roborev-dashboard.exe'
          & (Join-Path $env:SAFE_CHECKOUT 'scripts\release-e2e.ps1') -ArtifactPath $artifact

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roborev-dashboard-ci-windows-amd64
          path: ${{ env.SAFE_CHECKOUT }}\dist\ci\0.0.0-ci.1
          if-no-files-found: error
          retention-days: 7
