name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Tier 1
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefix web

      - name: Run repository tests
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Run Go vet
        shell: pwsh
        run: go vet ./...

      - name: Build development executable
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Check development executable contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\dist\roborev-dashboard.exe --help
          & .\dist\roborev-dashboard.exe --version
          & .\dist\roborev-dashboard.exe --version-json

      - name: Build reproducible CI package
        shell: pwsh
        run: ./scripts/package.ps1 -Version 0.0.0-ci.1 -OutputDirectory .\dist\ci\0.0.0-ci.1 -VerifyReproducible

      - name: Run packaged release smoke
        shell: pwsh
        run: |
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'dist\ci\0.0.0-ci.1\roborev-dashboard.exe'
          ./scripts/release-e2e.ps1 -ArtifactPath $artifact

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roborev-dashboard-ci-windows-amd64
          path: dist/ci/0.0.0-ci.1
          if-no-files-found: error
          retention-days: 7
